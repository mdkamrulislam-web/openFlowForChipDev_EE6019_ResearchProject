name: docs

on:
  push:
    # Documentation-only changes skip this workflow (Kamrul, 6 Nov 2026).
    paths:
      - '**'
      - '!**.md'
      - '!logbook/**'
      - '!docs/research/**'
      - '!docs/beginner-guide/**'
      - '!docs/shift-register-quickstart/**'
      - '!docs/slides/**'
      - 'docs/info.md'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26d
